[project]
name = "idx-scraper"
version = "0.1.0"
description = "Near-real-time IDX (Indonesia Stock Exchange) data scraper for algorithmic research"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.11",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "yfinance>=0.2.40",
    "pandas>=2.2",
]

[project.optional-dependencies]
supabase = [
    "psycopg[binary]>=3.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]
api = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    # Ruff DIPIN persis (bukan >=). Set aturan bawaannya berubah antar rilis —
    # PYI041 & DTZ007 yang memerahkan CI 2026-10-09 sudah aktif di default
    # 0.16.8 (terbukti dengan `ruff check --isolated`), jadi `>=0.5` membuat
    # gerbang lint bergantung pada rilis terbaru, bukan pada aturan yang
    # disetujui. Versi naik lewat commit yang sengaja (bump + jalankan
    # `ruff check src tests scripts`), bukan lewat resolusi otomatis.
    "ruff==0.16.8",
    "numpy>=1.26",
]

[project.scripts]
idx = "idx_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# CLI loads dotenv before imports on purpose
"src/idx_scraper/cli.py" = ["E402"]
# Broad exception catches are deliberate: scraping must survive per-item failures
"src/idx_scraper/*.py" = ["BLE001", "S110"]
# Same reasoning for the one-off backfill/refresh jobs: silent per-item skip,
# best-effort session close, and the `v != v` NaN guard are deliberate idioms.
"scripts/*.py" = ["BLE001", "S110", "S112", "PLR0124"]
