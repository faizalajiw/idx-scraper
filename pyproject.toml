[project]
name = "idx-scraper"
version = "0.1.0"
description = "Near-real-time IDX (Indonesia Stock Exchange) data scraper for algorithmic research"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.11",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
browser = [
    # Opsional: hanya untuk cadangan BrowserTransport (IDX_TRANSPORT=browser,
    # atau saat AutoTransport jatuh ke Chrome). Jalur HTTP tidak butuh ini,
    # jadi server Linux tanpa Chrome tidak perlu memasangnya sama sekali.
    "playwright>=1.40",
]
api = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reportlab>=4.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Ruff DIPIN persis (bukan >=). Set aturan bawaannya berubah antar rilis —
    # PYI041 & DTZ007 yang memerahkan CI 2026-10-09 sudah aktif di default
    # 0.16.8 (terbukti dengan `ruff check --isolated`), jadi `>=0.5` membuat
    # gerbang lint bergantung pada rilis terbaru, bukan pada aturan yang
    # disetujui. Versi naik lewat commit yang sengaja (bump + jalankan
    # `ruff check src tests scripts`), bukan lewat resolusi otomatis.
    "ruff==0.16.8",
    "numpy>=1.26",
]

[project.scripts]
idx = "idx_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Himpunan aturan eksplisit. Sebelumnya tidak ada `select`, jadi hanya default
# (E4/E7/E9/F) yang aktif dan `per-file-ignores` di bawah menunjuk kode yang
# tidak pernah menyala — gerbang lint-nya tidak efektif.
# ARG sengaja belum diambil: 185 argumen tak terpakai sebagian besar adalah
# parameter callback/route yang harus tetap bernama; butuh rename massal tanpa
# manfaat perilaku.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = [
    # Karakter tipografis (—, –, ×, →, ±) disengaja di docstring/komentar berbahasa
    # Indonesia; RUF002/RUF003 akan memaksa ASCII dan membuat prosa lebih buruk.
    "RUF001",
    "RUF002",
    "RUF003",
    # Lebar baris kode sudah ditegakkan `ruff format` (line-length 100). Sisa E501
    # hanya string SQL panjang dan komentar yang tidak bisa dipotong tanpa
    # menambah kebisingan; memotongnya mengubah teks SQL, bukan perilaku.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Facade paket schemas & analytics: semua impor di sini adalah re-export
# sengaja supaya nama lama tetap tersedia untuk app.py/services.py/tes.
"src/idx_scraper/api/analytics/__init__.py" = ["F401"]
"src/idx_scraper/api/schemas/__init__.py" = ["F401"]
"src/idx_scraper/smart_money/__init__.py" = ["F401"]
"src/idx_scraper/api/services/__init__.py" = ["F401"]
"src/idx_scraper/research/score_eval/__init__.py" = ["F401"]
"src/idx_scraper/research/recommend/__init__.py" = ["F401"]
# CLI loads dotenv before imports on purpose
"src/idx_scraper/cli.py" = ["E402"]
# Same pattern in this script: `sys.path` disisipi dulu supaya `idx_scraper`
# bisa diimpor saat dijalankan langsung (`python scripts/check_eod_gaps.py`).
"scripts/check_eod_gaps.py" = ["E402"]
# `scripts/` = skrip operasional satu-pakai yang dijalankan manual; keluarannya
# memang print, bukan log terstruktur. `print` hanya boleh hidup di
# `logging_setup.say` di dalam paket.
"scripts/*.py" = ["T201"]
# Pintu keluaran tunggal: satu-satunya `print` di `src/` ada di sini.
"src/idx_scraper/logging_setup.py" = ["T201"]

[tool.coverage.run]
source = ["src/idx_scraper"]

[tool.coverage.report]
# Ambang lantai, bukan target: baseline saat gerbang dipasang 2026-10-25 adalah
# 64% (10928 statement). Angka ini menahan penurunan, bukan memaksa setiap
# perubahan menambah tes; naikkan hanya setelah baseline benar-benar naik.
fail_under = 60
skip_covered = true
