name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (with api + dev extras)
        run: python -m pip install -e ".[api,dev]"

      - name: Lint (ruff)
        # Versi ruff dipin di extra ``dev`` (pyproject.toml); ``ruff --version``
        # dicetak supaya log CI menyebut versi mana yang benar-benar menjadi
        # gerbang, bukan versi terbaru yang kebetulan terpasang.
        run: |
          ruff --version
          ruff check src tests scripts

      - name: Tests (pytest)
        run: pytest
        env:
          # The unit suite must not need a live database; set a dummy so any
          # accidental DSN read fails loudly instead of silently skipping.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
